version: '3.9'

services:
  db:
    image: postgres:15
    container_name: lacrei_db
    environment:
      POSTGRES_DB: lacrei_db
      POSTGRES_USER: felipe
      POSTGRES_PASSWORD: sua_senha_forte
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db