[tool.poetry]
name = "lacrei-medical-api"
version = "0.1.0"
description = "API para o projeto Lacrei Medical"
authors = ["fezleep <virginio.9001@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.0"
djangorestframework = "^3.15"
psycopg2-binary = "^2.9"
python-dotenv = "^1.0"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.3"
drf-spectacular = "^0.27"
dj-database-url = "^3.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8"
flake8 = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"